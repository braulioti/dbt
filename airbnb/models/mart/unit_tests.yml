unit_tests:
    - name: test_fullmoon_matcher
      model: mart_fullmoon_reviews
      given:
        - input: ref('fct_reviews')
          rows:
            - { review_date: '2025-02-13' }
            - { review_date: '2025-02-14' }
            - { review_date: '2025-02-15' }
        - input: ref('seed_full_moon_dates')
          rows:
             - { full_moon_date: '2025-02-14' }
      expect:
        rows:
          - { review_date: '2025-02-13', is_full_moon: "not full moon" }
          - { review_date: '2025-02-14', is_full_moon: "not full moon" }
          - { review_date: '2025-02-15', is_full_moon: "full moon" }